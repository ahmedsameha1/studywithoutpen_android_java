apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion '28.0.3'

    defaultConfig {
        applicationId "com.ahmedsameha1.peninbin"
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 105
        versionName "3.59"
        multiDexEnabled true
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
        }
    }
    
    lintOptions {
        abortOnError false
    }
}

repositories {
    jcenter()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/CWAC-LoaderEx.jar')
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'com.google.firebase:firebase-appindexing:19.0.0'
    implementation 'com.google.android.gms:play-services-analytics:17.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.github.angads25:filepicker:1.0.6'
    implementation 'com.oguzdev:CircularFloatingActionMenu:1.0.2'
    implementation 'xyz.danoz:recyclerviewfastscroller:0.1.3'
    implementation 'com.pes.materialcolorpicker:library:1.2.0'
    implementation 'com.google.android:flexbox:0.3.0'
    implementation 'com.github.AppIntro:AppIntro:5.1.0'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:1.10.19'
}

apply plugin: 'com.google.gms.google-services'