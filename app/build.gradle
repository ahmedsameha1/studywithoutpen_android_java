apply plugin: 'com.android.application'

android {
    compileSdkVersion 25
    buildToolsVersion '25.0.0'

    defaultConfig {
        applicationId "com.ahmedsameha1.peninbin"
        minSdkVersion 17
        targetSdkVersion 25
        versionCode 92
        versionName "3.46"
        multiDexEnabled true
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
        }
    }
}

repositories {
    jcenter()
}

dependencies {
    compile fileTree(include: ['*.jar'], dir: 'libs')
    compile files('libs/CWAC-LoaderEx.jar')
    compile 'com.android.support:appcompat-v7:25.4.0'
    compile 'com.android.support:cardview-v7:25.4.0'
    compile 'com.android.support:recyclerview-v7:25.4.0'
    compile 'com.android.support:design:25.4.0'
    compile 'com.google.firebase:firebase-appindexing:11.0.2'
    compile 'com.google.android.gms:play-services-analytics:11.0.2'
    compile 'com.android.support:multidex:1.0.1'
    compile 'com.github.angads25:filepicker:1.0.6'
    compile 'com.oguzdev:CircularFloatingActionMenu:1.0.2'
    compile 'xyz.danoz:recyclerviewfastscroller:0.1.3'
    compile 'com.pes.materialcolorpicker:library:1.2.0'
    compile 'com.google.android:flexbox:0.3.0'
    compile 'com.github.apl-devs:appintro:v4.2.0'
    testCompile 'junit:junit:4.12'
    testCompile 'org.mockito:mockito-core:1.10.19'
}

apply plugin: 'com.google.gms.google-services'