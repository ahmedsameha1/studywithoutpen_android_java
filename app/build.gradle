apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'kotlin-android'

android {
    defaultConfig {
        applicationId "com.ahmedsameha1.peninbin"
        compileSdk = 36
        minSdkVersion 30
        targetSdkVersion 36
        versionCode 118
        versionName "3.67"
        multiDexEnabled true
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
        }
    }
    namespace 'com.ahmedsameha1.peninbin'
    lint {
        abortOnError false
    }
    buildFeatures {
        aidl true
    }

}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/CWAC-LoaderEx.jar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.firebase:firebase-appindexing:20.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.github.angads25:filepicker:1.0.6'
    implementation 'com.oguzdev:CircularFloatingActionMenu:1.0.2'
    implementation 'xyz.danoz:recyclerviewfastscroller:0.1.3'
    implementation 'com.cameron.materialcolorpicker:materialcolorpicker:2.0.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.github.AppIntro:AppIntro:5.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "com.anggrayudi:storage:0.13.0"

}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
