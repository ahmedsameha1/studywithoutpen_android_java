apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion '28.0.3'

    defaultConfig {
        applicationId "com.ahmedsameha1.peninbin"
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 97
        versionName "3.51"
        multiDexEnabled true
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
        }
    }
}

repositories {
    jcenter()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/CWAC-LoaderEx.jar')
    implementation 'com.android.support:appcompat-v7:27.1.1'
    implementation 'com.android.support:cardview-v7:27.1.1'
    implementation 'com.android.support:recyclerview-v7:27.1.1'
    implementation 'com.android.support:design:27.1.1'
    implementation 'com.google.firebase:firebase-appindexing:12.0.1'
    implementation 'com.google.android.gms:play-services-analytics:12.0.1'
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.github.angads25:filepicker:1.0.6'
    implementation 'com.oguzdev:CircularFloatingActionMenu:1.0.2'
    implementation 'xyz.danoz:recyclerviewfastscroller:0.1.3'
    implementation 'com.pes.materialcolorpicker:library:1.2.0'
    implementation 'com.google.android:flexbox:0.3.0'
    implementation 'com.github.apl-devs:appintro:v4.2.0'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:1.10.19'
}

apply plugin: 'com.google.gms.google-services'